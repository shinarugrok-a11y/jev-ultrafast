[project]
name = "jev-ultrafast"
version = "0.2.0"
description = "Shinaru Reflex Runtime: a System One reflex layer that chooses instead of generating. Browser agent included."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx[http2]>=0.28,<1"]

[project.scripts]
jev = "jev_ultrafast.demo:main"
jev-gateway = "jev_ultrafast.adapters.beowulf:main"
jev-eval = "jev_ultrafast.evals.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
